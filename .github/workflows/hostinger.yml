name: Publicar na Hostinger
# Monta o site como a Hostinger precisa (DATAVIX_HOST=hostinger, endereço datavix.app, .htaccess): landing e páginas de conteúdo na raiz, o app em /app/. Guarda o resultado na branch "hostinger".
# A Hostinger (hPanel > Avançado > Git, conectada ao GitHub) publica sozinha cada push nessa branch na pasta public_html.
# O mesmo site também fica como arquivo (artefato "datavix-hostinger") para quem prefere enviar pelo Gerenciador de Arquivos do hPanel.
# Passo a passo: docs/migracao-hostinger.md
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hostinger
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        env:
          DATAVIX_NPS_URL: ${{ secrets.DATAVIX_NPS_URL }}
          DATAVIX_NPS_TOKEN: ${{ secrets.DATAVIX_NPS_TOKEN }}
          DATAVIX_CONTACT_EMAIL: ${{ vars.DATAVIX_CONTACT_EMAIL }}
          DATAVIX_SITE: datavix.app
          DATAVIX_HOST: hostinger
          DATAVIX_CLARITY_HOST: datavix.app
          DATAVIX_GSC_TOKEN: ${{ vars.DATAVIX_GSC_TOKEN }}
          DATAVIX_BING_TOKEN: ${{ vars.DATAVIX_BING_TOKEN }}
          DATAVIX_SAMEAS: ${{ vars.DATAVIX_SAMEAS }}
        run: node build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: datavix-hostinger
          path: dist
          include-hidden-files: true
          retention-days: 30
      - name: Guardar o site na branch hostinger
        run: |
          set -euo pipefail
          SRC=$(git rev-parse --short HEAD)
          BUILD=$(grep -o 'window.__DV={"build":"[0-9a-f]*"' dist/app/index.html | grep -o '[0-9a-f]\{10\}' | head -1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin hostinger >/dev/null 2>&1; then
            git fetch --depth=1 origin hostinger
            git worktree add -B hostinger ../site FETCH_HEAD
          else
            git worktree add --detach ../site
            git -C ../site checkout --orphan hostinger
            git -C ../site rm -rf --quiet . || true
          fi
          rsync -a --delete --exclude='.git' dist/ ../site/
          cd ../site
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou: a branch hostinger já está atualizada."
          else
            git commit -q -m "Site ${SRC} (build ${BUILD})"
            git push origin hostinger
          fi
